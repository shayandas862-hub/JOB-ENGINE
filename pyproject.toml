[project]
name = "goal-a-engine"
version = "0.1.0"
description = "UK sponsor-aware job-search engine (fetch -> read -> rank). Human applies."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shayan Das" }]
dependencies = [
    "psycopg[binary]>=3.3,<4",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "google-genai>=2.10,<3",   # fast-moving SDK: upper-bounded on purpose
    "fastmcp>=3.4,<4",         # MCP server framework (Phase 5); fast-moving: upper-bounded on purpose
    "python-docx>=1.1,<2",     # ATS-safe .docx CV render (Phase 7)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "responses>=0.26,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
